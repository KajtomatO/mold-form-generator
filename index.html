<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mold Form Generator</title>
    <link rel="icon" href="data:," />
    <style>
      html { background: #101418; color-scheme: dark; }
      html[data-theme='light'] { background: #f2f4f7; color-scheme: light; }
    </style>
    <script>
      // Before the first paint, so a light theme never flashes dark. Storage may be blocked: then dark.
      try {
        if (localStorage.getItem('cfg-theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
